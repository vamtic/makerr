[workspace]
resolver = "2"
members = ["crates/tlm-core", "crates/tlm-app"]
# NOTE: `crates/tlm-core/vendor/image_parity` (see blend_parity.rs) is a path
# dependency of a member, so Cargo always treats it as a workspace member --
# `exclude` does not remove path-dependency auto-members. CI therefore passes
# `--exclude image` to clippy/build and `cargo test` so the vendored copy is
# neither linted, released, nor doc-tested.

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/vamtic/makerr"

[workspace.dependencies]
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "io-util",
    "process",
    "signal",
    "sync",
    "fs",
] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "gzip",
    "http2",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
md-5 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
rayon = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
dirs = "7"
futures = "0.3"
tempfile = "3"
open = "5"

tlm-core = { path = "crates/tlm-core" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
