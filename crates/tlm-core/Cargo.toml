[package]
name = "tlm-core"
description = "Core engine for TimelapseMaker: tile fetching, composition and ffmpeg encoding"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tokio.workspace = true
tokio-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
image.workspace = true
md-5.workspace = true
chrono.workspace = true
rayon.workspace = true
thiserror.workspace = true
dirs.workspace = true
futures.workspace = true
redb = "4"
zune-png = "0.5"

[dev-dependencies]
tempfile.workspace = true
# Test-only reference build of the `image` crate: an unmodified copy of the
# same version with the private `Blend` trait and the `color` module made
# public, so the blend-parity integration test can call the exact float
# src-over blend that `imageops::overlay` uses. Never used in shipping code.
image_parity = { package = "image", path = "vendor/image_parity", default-features = false, features = ["png", "jpeg"] }
